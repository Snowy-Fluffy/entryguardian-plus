<!DOCTYPE html>
<html lang="ru">

<head>
    <title>Captcha</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
    <link rel="stylesheet" href="/altcha/altcha.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #111;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            color: #eee;
            gap: 16px;
        }

        h2 {
            color: #ff4444;
            font-size: 1.3rem;
            letter-spacing: 2px;
        }

        iframe {
            border: 2px solid #444;
            display: block;
            max-width: 100%;
        }

        #intro {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #111;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            gap: 20px;
            padding: 24px;
            text-align: center;
        }

        #intro h2 {
            font-size: 1.5rem;
        }

        #intro-desc {
            font-size: 1.1rem;
            color: #ccc;
            max-width: 420px;
            line-height: 1.5;
        }

        #btn-start {
            margin-top: 8px;
            padding: 12px 32px;
            background: #1a1a1a;
            border: 2px solid #33ff33;
            color: #33ff33;
            font-family: 'Courier New', monospace;
            font-size: 1.1rem;
            cursor: pointer;
            letter-spacing: 2px;
            transition: background 0.15s, color 0.15s;
        }

        #btn-start:hover {
            background: #33ff33;
            color: #111;
        }

        #result, #stage-turnstile, #stage-altcha {
            display: none;
            text-align: center;
            padding: 24px 32px;
            background: #1a1a1a;
            border: 2px solid #33aa33;
            border-radius: 4px;
        }

        #result p, #stage-turnstile p, #stage-altcha p {
            margin-bottom: 14px;
            font-size: 1rem;
            color: #ccc;
        }

        #code-box {
            display: inline-block;
            background: #0a0a0a;
            border: 2px solid #33ff33;
            border-radius: 10px;
            padding: 14px 18px;
            margin: 14px 0;
            max-width: 100%;
            box-shadow: 0 0 18px rgba(51, 255, 51, 0.35), inset 0 0 24px rgba(51, 255, 51, 0.06);
        }

        #code-box img {
            display: block;
            width: 220px;
            max-width: 100%;
            height: auto;
            border-radius: 5px;
        }

        #hint {
            font-size: 0.85rem;
            color: #888;
            margin-top: 8px;
        }
    </style>
</head>

<body>
    <div id="intro">
        <h2>CAPTCHA</h2>
        <p id="intro-desc">__CAPTCHA_DESC__</p>
        <button id="btn-start">Пройти капчу</button>
    </div>
    <h2>CAPTCHA</h2>
    <iframe id="frame" src="" width="__IFRAME_WIDTH__" height="__IFRAME_HEIGHT__" style="__IFRAME_STYLE__"
        scrolling="auto" frameborder="0"></iframe>
    <div id="stage-turnstile">
        <p>Проверка браузера...</p>
        <div id="turnstile-widget"></div>
    </div>
    <div id="stage-altcha">
        <p>Ещё один момент...</p>
        <altcha-widget id="altcha-widget" configuration='{"hideLogo":true,"hideFooter":true}'></altcha-widget>
    </div>
    <div id="result">
        <p>&#x2705; Капча пройдена!</p>
        <p>Отправьте этот код боту:</p>
        <div id="code-box"><img id="code-img" alt="код"></div>
        <div id="hint">Введите код в чате с ботом для завершения верификации</div>
    </div>
    <script src="/altcha/altcha.js"></script>
    <script>
        globalThis.$altcha.algorithms.set('PBKDF2/SHA-512', function () {
            return new Worker('/altcha/workers/pbkdf2.js');
        });
    </script>
    <script>
        var uuid = '__UUID__';
        var challenge = '__CHALLENGE__';
        var iframeSrc = '__IFRAME_SRC__';
        var turnstileSiteKey = '__TURNSTILE_SITE_KEY__';
        var turnstileEnabled = __TURNSTILE_ENABLED__;
        var done = false;
        var turnstileWidgetId = null;

        function advanceAfterGame() {
            if (turnstileEnabled) {
                showTurnstileStage();
            } else {
                document.getElementById('frame').style.display = 'none';
                showAltchaStage();
            }
        }

        document.getElementById('btn-start').addEventListener('click', function () {
            document.getElementById('intro').style.display = 'none';
            document.getElementById('frame').src = iframeSrc;
        });

        function showResult() {
            document.getElementById('stage-altcha').style.display = 'none';
            document.getElementById('code-img').src = '/api/captcha/' + uuid + '/code.png?t=' + Date.now();
            document.getElementById('result').style.display = 'block';
            document.getElementById('result').scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function renderTurnstile() {
            turnstileWidgetId = turnstile.render('#turnstile-widget', {
                sitekey: turnstileSiteKey,
                theme: 'dark',
                callback: onTurnstileSuccess,
                'error-callback': function () {
                    if (turnstileWidgetId !== null) turnstile.reset(turnstileWidgetId);
                }
            });
        }

        function showTurnstileStage() {
            document.getElementById('frame').style.display = 'none';
            document.getElementById('stage-turnstile').style.display = 'block';
            document.getElementById('stage-turnstile').scrollIntoView({ behavior: 'smooth', block: 'center' });
            if (window.turnstile) {
                renderTurnstile();
            } else {
                var iv = setInterval(function () {
                    if (window.turnstile) {
                        clearInterval(iv);
                        renderTurnstile();
                    }
                }, 100);
            }
        }

        function onTurnstileSuccess(token) {
            fetch('/api/captcha/' + uuid + '/verify_turnstile', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ challenge: challenge, token: token })
            })
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    if (data.ok) {
                        showAltchaStage();
                    } else if (turnstileWidgetId !== null) {
                        turnstile.reset(turnstileWidgetId);
                    }
                })
                .catch(function () {
                    if (turnstileWidgetId !== null) turnstile.reset(turnstileWidgetId);
                });
        }

        function showAltchaStage() {
            document.getElementById('stage-turnstile').style.display = 'none';
            document.getElementById('stage-altcha').style.display = 'block';
            document.getElementById('stage-altcha').scrollIntoView({ behavior: 'smooth', block: 'center' });
            document.getElementById('altcha-widget').configure({
                challenge: '/api/captcha/' + uuid + '/altcha_challenge?challenge=' + encodeURIComponent(challenge)
            });
        }

        document.getElementById('altcha-widget').addEventListener('verified', function (e) {
            var payload = e.detail && e.detail.payload;
            if (!payload) return;
            fetch('/api/captcha/' + uuid + '/verify_altcha', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ challenge: challenge, payload: payload })
            })
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    if (data.ok) {
                        showResult();
                    } else {
                        document.getElementById('altcha-widget').reset();
                    }
                });
        });

        window.addEventListener('message', function (e) {
            if (done) return;
            if (e.origin !== window.location.origin) return;
            if (!e.data) return;

            // Tetris: iframe already called /complete itself and just signals it's done
            if (e.data.type === 'doom_complete' && e.data.already_done) {
                done = true;
                advanceAfterGame();
                return;
            }

            // Doom (type=doom_complete) or Mario (event=levelComplete)
            var isDoom = (e.data.type === 'doom_complete');
            var isMario = (e.data.event === 'levelComplete');
            if (!isDoom && !isMario) return;
            done = true;

            fetch('/api/captcha/' + uuid + '/complete', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({challenge: challenge})
            })
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    if (data.ok) {
                        advanceAfterGame();
                    }
                });
        });
    </script>
</body>

</html>
