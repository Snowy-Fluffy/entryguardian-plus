services:
  entryguardian:
    build: .
    container_name: entryguardian
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "127.0.0.1:8080:8080"

    # The database lives in a mounted *directory*, not a single mounted file: SQLite keeps its
    # WAL/journal as sibling files, which a file mount would leave inside the container layer.
    volumes:
      - ./data:/app/data

    environment:
      - PYTHONUNBUFFERED=1
      - DB_PATH=/app/data/users.db
